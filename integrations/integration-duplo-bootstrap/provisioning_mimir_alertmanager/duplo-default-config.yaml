global:
  resolve_timeout: 5m
  http_config:
    tls_config:
      insecure_skip_verify: false
    follow_redirects: true
    enable_http2: true
route:
  receiver: default-receiver
  group_by:
    - alertname
  routes:
    - receiver: duplo-loki-webhook
      continue: true
      group_by:
        - "..."
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 999w
    - receiver: duplo-webhook-notifications
      matchers:
        - namespace=~"${AOS_NAMESPACE_FILTER}"
        - severity!="info"
        - daemonset!~"duplo-monitoring-.*"
        - alertname!="KubeHpaMaxedOut"
        - pod!~"duplo-monitoring-beyla-.*"
        - pod!~"duplo-monitoring-prometheus-.*"
        - pod!~"duplo-monitoring-alloy-profiles-.*"
        - pod!~"duplo-monitoring-alloy-logs-.*"
receivers:
  - name: duplo-loki-webhook
    webhook_configs:
      - send_resolved: true
        url: ${AOS_LOKI_WEBHOOK}
  - name: default-receiver
    slack_configs: []
  - name: duplo-webhook-notifications
    webhook_configs:
      - send_resolved: true
        url: ${AOS_AUTOMATION_WEBHOOK}
templates:
  - duplo_templates.tpl
