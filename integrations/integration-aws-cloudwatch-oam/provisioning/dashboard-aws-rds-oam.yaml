                    type: cloudwatch
                    uid: $datasource
                  dimensions:
                    DBInstanceIdentifier: $Identifier
                  expression: ""
                  label: ${PROP('Dim.DBInstanceIdentifier')}
                  matchExact: true
                  metricEditorMode: 0
                  metricName: CPUUtilization
                  metricQueryType: 0
