apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
    folder: integration-aws-cloudwatch-oam
    name: aws-rds-oam
spec:
    annotations:
        list:
            - builtIn: 1
              datasource:
                type: datasource
                uid: duplo-aws
              enable: true
              hide: true
              iconColor: rgba(0, 211, 255, 1)
              name: Annotations & Alerts
              type: dashboard
    description: Visualize Amazon RDS metrics across OAM-linked AWS accounts
    editable: false
    fiscalYearStartMonth: 0
    graphTooltip: 0
    links: []
    panels:
        - collapsed: true
          datasource:
            uid: $datasource
          gridPos:
            h: 1
            w: 24
            x: 0
            "y": 0
          id: 7
          panels:
            - datasource:
                default: false
                type: cloudwatch
                uid: $datasource
              fieldConfig:
                defaults:
                    color:
                        mode: palette-classic
                    custom:
                        axisBorderShow: false
                        axisCenteredZero: false
                        axisColorMode: text
                        axisLabel: ""
                        axisPlacement: auto
                        barAlignment: 0
                        barWidthFactor: 0.6
                        drawStyle: line
                        fillOpacity: 0
                        gradientMode: none
                        hideFrom:
                            legend: false
                            tooltip: false
                            viz: false
                        insertNulls: false
                        lineInterpolation: linear
                        lineWidth: 1
                        pointSize: 5
                        scaleDistribution:
                            type: linear
                        showPoints: never
                        spanNulls: false
                        stacking:
                            group: A
                            mode: none
                        thresholdsStyle:
                            mode: "off"
                    mappings: []
                    thresholds:
                        mode: absolute
                        steps:
                            - color: green
                            - color: red
                              value: 80
                    unit: short
                overrides: []
              gridPos:
                h: 8
                w: 24
                x: 0
                "y": 1
              id: 5
              options:
                legend:
                    calcs:
                        - mean
                    displayMode: table
                    placement: right
                    showLegend: true
                tooltip:
                    mode: multi
                    sort: none
              targets:
