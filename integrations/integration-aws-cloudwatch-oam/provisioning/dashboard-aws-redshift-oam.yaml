              definition: ""
              description: 'Source account to query. Requires CloudWatch cross-account observability (OAM); "All" targets every linked account.'
              hide: 0
              includeAll: true
              label: Account
              multi: false
              name: account
              options: []
              query:
                queryType: accounts
                refId: CloudWatchVariableQueryEditor-VariableQuery
                region: $region
              refresh: 1
              regex: /^(?![Aa][Ll][Ll]$).+/
              skipUrlSync: false
              sort: 0
              type: query
