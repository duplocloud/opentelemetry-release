    refresh: ""
    schemaVersion: 39
    tags:
        - cloudwatch
    templating:
        list:
            - current:
                selected: false
                text: duplo-aws
                value: duplo-aws
              hide: 0
              includeAll: false
              label: Data source
              multi: false
              name: datasource
              options: []
              query: cloudwatch
              queryValue: ""
              refresh: 1
              regex: ""
              skipUrlSync: false
              type: datasource
            - current: {}
              datasource:
                type: cloudwatch
                uid: $datasource
              definition: ""
              hide: 0
              includeAll: false
              label: Region
              multi: false
              name: region
              options: []
              query: regions()
              refresh: 1
              regex: ""
              skipUrlSync: false
              sort: 0
              type: query
            - allValue: all
              current:
                selected: true
                text: All
                value: $__all
              datasource:
                type: cloudwatch
                uid: $datasource
              definition: ""
              description: 'Source account to query. Requires CloudWatch cross-account observability (OAM); "All" targets every linked account.'
              hide: 0
              includeAll: true
              label: Account
              multi: false
              name: account
              options: []
              query:
                queryType: accounts
                refId: CloudWatchVariableQueryEditor-VariableQuery
                region: $region
              refresh: 1
              regex: /^(?![Aa][Ll][Ll]$).+/
              skipUrlSync: false
              sort: 0
              type: query
            - current:
                selected: false
                text: ""
                value: ""
              datasource:
                type: cloudwatch
                uid: $datasource
              definition: ""
              description: FileSystemId in the selected account.
              hide: 0
              includeAll: false
              label: FileSystemId
              multi: false
              name: filesystemid
              options: []
              query:
                accountId: $account
                dimensionFilters: {}
                dimensionKey: FileSystemId
                metricName: DataReadIOBytes
                namespace: AWS/EFS
                queryType: dimensionValues
                refId: CloudWatchVariableQueryEditor-VariableQuery
                region: $region
              refresh: 1
              regex: ""
              skipUrlSync: false
              sort: 1
              type: query
    time:
