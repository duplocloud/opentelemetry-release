apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
    folder: integration-aws-cloudwatch-oam
    name: aws-efs-oam
spec:
    annotations:
        list:
            - builtIn: 1
              datasource:
                type: grafana
                uid: -- Grafana --
              enable: true
              hide: true
              iconColor: rgba(0, 211, 255, 1)
              name: Annotations & Alerts
              type: dashboard
    description: Visualize AWS EFS metrics
    editable: false
    fiscalYearStartMonth: 0
    graphTooltip: 0
    links: []
    panels:
        - datasource:
            uid: $datasource
          fieldConfig:
            defaults:
                color:
                    mode: palette-classic
                custom:
                    axisBorderShow: false
                    axisCenteredZero: false
                    axisColorMode: text
                    axisLabel: ""
                    axisPlacement: auto
                    barAlignment: 0
                    barWidthFactor: 0.6
                    drawStyle: line
                    fillOpacity: 10
                    gradientMode: none
                    hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                    insertNulls: false
                    lineInterpolation: linear
                    lineWidth: 1
                    pointSize: 5
                    scaleDistribution:
                        type: linear
                    showPoints: never
                    spanNulls: false
                    stacking:
                        group: A
                        mode: none
                    thresholdsStyle:
                        mode: "off"
                mappings: []
                min: 0
                thresholds:
                    mode: absolute
                    steps:
                        - color: green
                          value: null
                        - color: red
                          value: 80
                unit: bytes
            overrides:
                - matcher:
                    id: byName
                    options: Latency_Average
                  properties:
                    - id: unit
                      value: none
                    - id: custom.axisPlacement
                      value: right
                - matcher:
                    id: byName
                    options: TargetResponseTime_Average
                  properties:
                    - id: unit
                      value: none
                    - id: custom.axisPlacement
                      value: right
                - matcher:
                    id: byName
                    options: ClientConnections_Sum
                  properties:
                    - id: unit
                      value: none
                    - id: custom.axisPlacement
                      value: right
          gridPos:
            h: 7
            w: 24
            x: 0
            "y": 0
          id: 7
          options:
            legend:
                calcs:
                    - mean
                    - max
                    - min
                displayMode: table
                placement: bottom
                showLegend: true
            tooltip:
                mode: multi
                sort: none
          pluginVersion: 11.4.0
          targets:
            - accountId: $account
              alias: ""
              application:
                filter: ""
              datasource:
                type: cloudwatch
                uid: $datasource
              dimensions:
                FileSystemId: $filesystemid
              functions: []
              group:
                filter: ""
              host:
                filter: ""
              item:
                filter: ""
              label: ${PROP('Dim.FileSystemId')}
              metricEditorMode: 0
              metricName: DataReadIOBytes
              metricQueryType: 0
              mode: 0
              namespace: AWS/EFS
              options:
                showDisabledItems: false
              period: ""
              refId: A
              region: $region
              statistic: Average
            - accountId: $account
              alias: ""
              application:
                filter: ""
              datasource:
                uid: $datasource
              dimensions:
                FileSystemId: $filesystemid
              functions: []
              group:
                filter: ""
              host:
                filter: ""
              item:
                filter: ""
              label: ${PROP('Dim.FileSystemId')}
              metricEditorMode: 0
              metricName: DataWriteIOBytes
              metricQueryType: 0
              mode: 0
              namespace: AWS/EFS
              options:
                showDisabledItems: false
              period: ""
              refId: B
              region: $region
              statistic: Average
            - accountId: $account
              alias: ""
              application:
                filter: ""
              datasource:
                type: cloudwatch
                uid: $datasource
              dimensions:
                FileSystemId: $filesystemid
              functions: []
              group:
                filter: ""
              host:
                filter: ""
              item:
                filter: ""
              label: ${PROP('Dim.FileSystemId')}
