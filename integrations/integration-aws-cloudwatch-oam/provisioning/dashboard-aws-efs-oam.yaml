              metricQueryType: 0
              mode: 0
              namespace: AWS/EFS
              options:
                showDisabledItems: false
              period: ""
              refId: C
              region: $region
              statistic: Average
            - accountId: $account
              alias: ""
              application:
                filter: ""
              datasource:
                uid: $datasource
              dimensions:
                FileSystemId: $filesystemid
              functions: []
              group:
                filter: ""
              host:
                filter: ""
              item:
                filter: ""
              label: ${PROP('Dim.FileSystemId')}
              metricEditorMode: 0
              metricName: ClientConnections
              metricQueryType: 0
              mode: 0
              namespace: AWS/EFS
              options:
                showDisabledItems: false
              period: ""
              refId: D
              region: $region
              statistic: Sum
          title: Bytes/ClientConnections
          type: timeseries
        - datasource:
            type: cloudwatch
            uid: $datasource
          fieldConfig:
            defaults:
                color:
                    mode: palette-classic
                custom:
                    axisBorderShow: false
                    axisCenteredZero: false
                    axisColorMode: text
