apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
    folder: integration-aws-cloudwatch-oam
    name: aws-ecs-oam
spec:
    annotations:
        list:
            - builtIn: 1
              datasource:
                type: datasource
                uid: grafana
              enable: true
              hide: true
              iconColor: rgba(0, 211, 255, 1)
              name: Annotations & Alerts
              type: dashboard
    description: Visualize AWS ECS metrics
    editable: false
    fiscalYearStartMonth: 0
    gnetId: 551
    graphTooltip: 0
    links: []
    panels:
        - datasource:
            uid: $datasource
          fieldConfig:
            defaults:
                color:
                    mode: palette-classic
                custom:
                    axisBorderShow: false
                    axisCenteredZero: false
                    axisColorMode: text
                    axisLabel: ""
                    axisPlacement: auto
                    barAlignment: 0
                    barWidthFactor: 0.6
                    drawStyle: line
                    fillOpacity: 10
                    gradientMode: none
                    hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                    insertNulls: false
                    lineInterpolation: linear
                    lineWidth: 1
                    pointSize: 5
                    scaleDistribution:
                        type: linear
                    showPoints: never
                    spanNulls: false
                    stacking:
                        group: A
                        mode: none
                    thresholdsStyle:
                        mode: "off"
                mappings: []
                max: 100
                min: 0
                thresholds:
                    mode: absolute
                    steps:
                        - color: green
                          value: null
                        - color: red
                          value: 80
                unit: percent
            overrides: []
          gridPos:
            h: 7
            w: 24
            x: 0
            "y": 0
          id: 1
          options:
            alertThreshold: true
            legend:
                calcs:
                    - mean
                    - max
                    - min
                displayMode: table
                placement: bottom
                showLegend: true
            tooltip:
                mode: multi
                sort: none
          pluginVersion: 11.3.1
          targets:
            - accountId: $account
              alias: ""
              datasource:
                type: cloudwatch
                uid: $datasource
              dimensions:
                ClusterName: $cluster
                ServiceName: $service
              expression: ""
              id: ""
              label: ${PROP('Dim.ServiceName')}
              matchExact: true
              metricEditorMode: 0
              metricName: CPUUtilization
              metricQueryType: 0
              namespace: AWS/ECS
              period: ""
              refId: A
              region: $region
              statistic: Average
          title: CPUUtilization
          type: timeseries
