apiVersion: grizzly.grafana.com/v1alpha1
kind: AlertNotificationPolicy
metadata:
  name: global
spec:
  group_by:
    - grafana_folder
    - alertname
  receiver: empty
  orgId: 1
  routes:
    - object_matchers: []
      continue: true
      group_by:
        - "..."
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 999w
      receiver: duplo-loki-webhook
    - object_matchers:
        - - owner
          - =
          - duplo
        - - alertname
          - =
          - AlertmanagerWebhookFailed
      receiver: duplo-aos-slack
    - object_matchers:
        - - tenant
          - =~
          - ${AOS_NAMESPACE_FILTER}
      receiver: duplo-webhook-notifications
    - object_matchers:
        - - namespace
          - =~
          - ${AOS_NAMESPACE_FILTER}
      receiver: duplo-webhook-notifications
    - object_matchers:
        - - label_tenantname
          - =~
          - ${AOS_NAMESPACE_FILTER}
      receiver: duplo-webhook-notifications
    - object_matchers:
        - - owner
          - =
          - duplo
      receiver: duplo-webhook-notifications