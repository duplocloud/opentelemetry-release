apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
  folder: integration-alerthistory
  name: alerthistory-mimir-details
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: '-- Grafana --'
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  description: Mimir alert history for a specific alert — firing and resolved events
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 2
  links: []
  panels:

  # ── Header ────────────────────────────────────────────────────────────────
  - gridPos:
      h: 3
      w: 24
      x: 0
      y: 0
    id: 1
    options:
      code:
        language: plaintext
        showLineNumbers: false
        showMiniMap: false
      content: '<div style="font-family:Arial,sans-serif;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;"><div><h1
        style="margin:0;font-size:2em;font-weight:bold;color:rgb(0,173,181);">Mimir
        Alert Details: ${alertname}</h1><span style="font-size:.9em;color:#aaa;">Firing
        &amp; resolved events from Loki</span></div><a href="/d/alerthistory-overview/alert-history-overview"
        style="color:rgb(0,173,181);font-size:.95em;text-decoration:none;">&#8592;
        Back to Overview</a></div>'
      mode: html
    pluginVersion: 11.5.2
    transparent: true
    type: text

  # ── Stat panels ───────────────────────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: red
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 0
      y: 3
    id: 2
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({alertname=~"$alertname", cluster=~"$cluster", namespace=~"$namespace"} | json
        status="status" | status="firing" [$__range]))
      legendFormat: firing
      queryType: instant
      refId: A
    title: Total Firing
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: green
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 6
      y: 3
    id: 3
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({alertname=~"$alertname", cluster=~"$cluster", namespace=~"$namespace"} | json
        status="status" | status="resolved" [$__range]))
      legendFormat: resolved
      queryType: instant
      refId: A
    title: Total Resolved
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: blue
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: blue
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 12
      y: 3
    id: 4
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({alertname=~"$alertname", cluster=~"$cluster", namespace=~"$namespace"} [$__range]))
      legendFormat: total
      queryType: instant
      refId: A
    title: Total Events
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: purple
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: purple
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 18
      y: 3
    id: 5
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - lastNotNull
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: count(sum by (cluster, namespace) (count_over_time({alertname=~"$alertname",
        cluster=~"$cluster", namespace=~"$namespace"} [$__range])))
      legendFormat: instances
      queryType: instant
      refId: A
    title: Instances (Cluster/NS)
    type: stat

  # ── Alert Trigger Details table ───────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: true
          inspect: false
          wrapText: true
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides:
      - matcher:
          id: byName
          options: status
        properties:
        - id: mappings
          value:
          - options:
              firing:
                color: red
                index: 0
                text: Firing
              resolved:
                color: green
                index: 1
                text: Resolved
            type: value
        - id: custom.cellOptions
          value:
            type: color-background
        - id: custom.width
          value: 100
      - matcher:
          id: byName
          options: severity
        properties:
        - id: custom.cellOptions
          value:
            mode: basic
            type: color-background
        - id: mappings
          value:
          - options:
              critical:
                color: red
                index: 0
              info:
                color: blue
                index: 2
              warning:
                color: orange
                index: 1
            type: value
        - id: custom.width
          value: 90
      - matcher:
          id: byName
          options: cluster
        properties:
        - id: custom.width
          value: 150
      - matcher:
          id: byName
          options: namespace
        properties:
        - id: custom.width
          value: 200
      - matcher:
          id: byName
          options: summary
        properties:
        - id: custom.width
          value: 220
      - matcher:
          id: byName
          options: description
        properties:
        - id: custom.width
          value: 600
        - id: custom.wrapText
          value: true
        - id: displayName
          value: Trigger (Metric Detail)
      - matcher:
          id: byName
          options: Time
        properties:
        - id: custom.width
          value: 170
    gridPos:
      h: 10
      w: 24
      x: 0
      y: 7
    id: 10
    options:
      cellHeight: sm
      showHeader: true
      sortBy:
      - desc: true
        displayName: Time
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      direction: backward
      editorMode: code
      expr: '{alertname=~"$alertname", cluster=~"$cluster", namespace=~"$namespace"} | json status="status",
        description="annotations.description", summary="annotations.summary"'
      maxLines: 200
      queryType: range
      refId: A
    title: Alert Trigger Details
    transformations:
    - id: extractFields
      options:
        format: json
        keepTime: false
        replace: false
        source: labels
    - id: organize
      options:
        excludeByName:
          Line: true
          labels: true
          labelTypes: true
          detected_level: true
          service_name: true
          __stream_shard__: true
        indexByName:
          Time: 0
          status: 1
          alertname: 2
          severity: 3
          cluster: 4
          namespace: 5
          summary: 6
          description: 7
    type: table

  # ── Firing vs Resolved over time ──────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    description: Firing events for this alert over the selected time range.
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisColorMode: text
          barAlignment: 0
          barWidthFactor: 0.9
          drawStyle: bars
          fillOpacity: 0
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineWidth: 2
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: always
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: 'off'
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
          - color: red
            value: 80
      overrides: []
    gridPos:
      h: 8
      w: 12
      x: 0
      y: 17
    id: 11
    options:
      legend:
        calcs:
        - sum
        - max
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: true
        mode: multi
        sort: desc
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      direction: backward
      editorMode: code
      expr: sum by (cluster, namespace) (count_over_time({alertname=~"$alertname",
        cluster=~"$cluster", namespace=~"$namespace"} | json status="status" | status="firing" [$__interval]))
      legendFormat: '{{cluster}} / {{namespace}}'
      queryType: range
      refId: A
    title: Firing Over Time
    type: timeseries
  - datasource:
      type: loki
      uid: ${datasource}
    description: Resolved events for this alert over the selected time range.
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisColorMode: text
          barAlignment: 0
          barWidthFactor: 0.9
          drawStyle: bars
          fillOpacity: 0
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineWidth: 2
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: always
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: 'off'
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides: []
    gridPos:
      h: 8
      w: 12
      x: 12
      y: 17
    id: 12
    options:
      legend:
        calcs:
        - sum
        - max
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: true
        mode: multi
        sort: desc
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      direction: backward
      editorMode: code
      expr: sum by (cluster, namespace) (count_over_time({alertname=~"$alertname",
        cluster=~"$cluster", namespace=~"$namespace"} | json status="status" | status="resolved" [$__interval]))
      legendFormat: '{{cluster}} / {{namespace}}'
      queryType: range
      refId: A
    title: Resolved Over Time
    type: timeseries

  # ── Alert Events by Cluster / Namespace ───────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisColorMode: text
          barAlignment: 0
          barWidthFactor: 0.6
          drawStyle: bars
          fillOpacity: 80
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineWidth: 1
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: never
          spanNulls: false
          stacking:
            group: A
            mode: none
          thresholdsStyle:
            mode: dashed
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
          - color: red
            value: 1
      overrides:
      - matcher:
          id: byRegexp
          options: ^✓.*
        properties:
        - id: color
          value:
            fixedColor: green
            mode: fixed
    gridPos:
      h: 10
      w: 24
      x: 0
      y: 25
    id: 13
    options:
      legend:
        calcs:
        - sum
        - max
        - lastNotNull
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: false
        mode: multi
        sort: desc
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum by (cluster, namespace) (count_over_time({alertname=~"$alertname",
        cluster=~"$cluster", namespace=~"$namespace"} | json status="status" | status="firing" [$__interval]))
      legendFormat: '{{cluster}} | {{namespace}}'
      queryType: range
      refId: A
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum by (cluster, namespace) (count_over_time({alertname=~"$alertname",
        cluster=~"$cluster", namespace=~"$namespace"} | json status="status" | status="resolved" [$__interval]))
      legendFormat: "✓ {{cluster}} | {{namespace}}"
      queryType: range
      refId: B
    title: Alert Events by Cluster / Namespace
    type: timeseries

  # ── Raw log panel ─────────────────────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    gridPos:
      h: 12
      w: 24
      x: 0
      y: 35
    id: 14
    options:
      dedupStrategy: none
      enableInfiniteScrolling: false
      enableLogDetails: true
      prettifyLogMessage: true
      showCommonLabels: false
      showControls: false
      showFieldSelector: false
      showLabels: true
      showLevel: true
      showTime: true
      sortOrder: Descending
      wrapLogMessage: false
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: '{alertname=~"$alertname", cluster=~"$cluster", namespace=~"$namespace"} | json'
      maxLines: 200
      queryType: range
      refId: A
    title: Alert Event Log
    type: logs

  refresh: 30s
  schemaVersion: 42
  tags:
  - alerthistory
  - mimir
  - details
  templating:
    list:
    - current:
        text: duplo-logging
        value: duplo-logging
      includeAll: false
      label: Loki Datasource
      name: datasource
      options: []
      query: loki
      refresh: 1
      regex: ''
      type: datasource
    - allValue: .+
      current:
        text: All
        value: $__all
      datasource:
        type: loki
        uid: ${datasource}
      definition: ''
      includeAll: true
      label: Alert Name
      multi: false
      name: alertname
      options: []
      query:
        label: alertname
        refId: LokiVariableQueryEditor-VariableQuery
        stream: '{alertname!=""}'
        type: 1
      refresh: 2
      regex: ''
      sort: 1
      type: query
    - allValue: .+
      current:
        text: All
        value: $__all
      datasource:
        type: loki
        uid: ${datasource}
      definition: ''
      includeAll: true
      label: Cluster
      multi: false
      name: cluster
      options: []
      query:
        label: cluster
        refId: LokiVariableQueryEditor-VariableQuery
        stream: '{alertname!=""}'
        type: 1
      refresh: 2
      regex: ''
      sort: 1
      type: query
    - allValue: .+
      current:
        text: All
        value: $__all
      datasource:
        type: loki
        uid: ${datasource}
      definition: ''
      includeAll: true
      label: Namespace
      multi: false
      name: namespace
      options: []
      query:
        label: namespace
        refId: LokiVariableQueryEditor-VariableQuery
        stream: '{alertname!="", cluster=~"$cluster"}'
        type: 1
      refresh: 2
      regex: ''
      sort: 1
      type: query
  time:
    from: now-24h
    to: now
  timepicker: {}
  timezone: browser
  title: Mimir Alert Details
  uid: alerthistory-mimir-details
