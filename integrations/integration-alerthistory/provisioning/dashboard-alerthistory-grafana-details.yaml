apiVersion: grizzly.grafana.com/v1alpha1
kind: Dashboard
metadata:
  folder: integration-alerthistory
  name: alerthistory-grafana-details
spec:
  annotations:
    list:
    - builtIn: 1
      datasource:
        type: grafana
        uid: '-- Grafana --'
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      type: dashboard
  description: Grafana alert state transition history for a specific alert
  editable: true
  fiscalYearStartMonth: 0
  graphTooltip: 2
  links: []
  panels:

  # ── Header ────────────────────────────────────────────────────────────────
  - gridPos:
      h: 3
      w: 24
      x: 0
      y: 0
    id: 1
    options:
      code:
        language: plaintext
        showLineNumbers: false
        showMiniMap: false
      content: '<div style="font-family:Arial,sans-serif;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;"><div><h1
        style="margin:0;font-size:2em;font-weight:bold;color:rgb(0,173,181);">Grafana
        Alert Details: ${group}</h1><span style="font-size:.9em;color:#aaa;">State
        transitions from Grafana alert state history</span></div><a href="/d/alerthistory-overview/alert-history-overview"
        style="color:rgb(0,173,181);font-size:.95em;text-decoration:none;">&#8592;
        Back to Overview</a></div>'
      mode: html
    pluginVersion: 11.5.2
    transparent: true
    type: text

  # ── Stat panels ───────────────────────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: blue
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: blue
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 0
      y: 3
    id: 11
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json
        alertname="labels.alertname", current, previous, ruleTitle, severity="labels.severity"
        | alertname=~"(?i).*$alertname.*" [$__range]))
      legendFormat: ''
      queryType: instant
      refId: A
    title: Total Transitions
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: red
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: red
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 6
      y: 3
    id: 12
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json
        alertname="labels.alertname", current, previous, ruleTitle, severity="labels.severity"
        | alertname=~"(?i).*$alertname.*" | current=~"Alerting.*" [$__range]))
      legendFormat: ''
      queryType: instant
      refId: A
    title: Firing (Alerting)
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: green
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 12
      y: 3
    id: 13
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json
        alertname="labels.alertname", current, previous, ruleTitle, severity="labels.severity"
        | alertname=~"(?i).*$alertname.*" | current=~"Normal.*" [$__range]))
      legendFormat: ''
      queryType: instant
      refId: A
    title: Resolved (Normal)
    type: stat
  - datasource:
      type: loki
      uid: ${datasource}
    fieldConfig:
      defaults:
        color:
          fixedColor: yellow
          mode: fixed
        noValue: '0'
        thresholds:
          mode: absolute
          steps:
          - color: yellow
            value: 0
      overrides: []
    gridPos:
      h: 4
      w: 6
      x: 18
      y: 3
    id: 14
    options:
      colorMode: background
      graphMode: none
      justifyMode: center
      orientation: auto
      reduceOptions:
        calcs:
        - sum
        fields: ''
        values: false
      textMode: auto
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum(count_over_time({from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json
        alertname="labels.alertname", current, previous, ruleTitle, severity="labels.severity"
        | alertname=~"(?i).*$alertname.*" | current=~"Pending.*" [$__range]))
      legendFormat: ''
      queryType: instant
      refId: A
    title: Pending
    type: stat

  # ── State transitions over time ───────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    description: Alert state transitions over the selected time range.
    fieldConfig:
      defaults:
        color:
          mode: palette-classic
        custom:
          axisBorderShow: false
          axisColorMode: text
          barAlignment: 0
          barWidthFactor: 0.6
          drawStyle: bars
          fillOpacity: 80
          gradientMode: none
          hideFrom:
            legend: false
            tooltip: false
            viz: false
          insertNulls: false
          lineWidth: 1
          pointSize: 5
          scaleDistribution:
            type: linear
          showPoints: never
          spanNulls: false
          stacking:
            group: A
            mode: normal
          thresholdsStyle:
            mode: 'off'
        mappings: []
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
      overrides:
      - matcher:
          id: byRegexp
          options: Alerting.*
        properties:
        - id: color
          value:
            fixedColor: red
            mode: fixed
      - matcher:
          id: byRegexp
          options: Normal.*
        properties:
        - id: color
          value:
            fixedColor: green
            mode: fixed
      - matcher:
          id: byRegexp
          options: Pending.*
        properties:
        - id: color
          value:
            fixedColor: yellow
            mode: fixed
      - matcher:
          id: byRegexp
          options: (NoData|Error).*
        properties:
        - id: color
          value:
            fixedColor: gray
            mode: fixed
    gridPos:
      h: 8
      w: 24
      x: 0
      y: 21
    id: 15
    interval: 1m
    options:
      legend:
        calcs:
        - sum
        - max
        displayMode: table
        placement: bottom
        showLegend: true
      tooltip:
        hideZeros: false
        mode: multi
        sort: desc
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: sum by (current) (count_over_time({from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"}
        | json alertname="labels.alertname", current, previous, ruleTitle, severity="labels.severity"
        | alertname=~"(?i).*$alertname.*" [$__interval]))
      legendFormat: '{{current}}'
      queryType: range
      refId: A
    title: State Transitions Over Time
    type: timeseries

  # ── Full detail table ─────────────────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    description: Complete state transition log with rule info, condition, and fingerprint.
    fieldConfig:
      defaults:
        color:
          mode: thresholds
        custom:
          align: auto
          cellOptions:
            type: auto
          filterable: true
          inspect: false
        mappings: []
        thresholds:
          mode: absolute
          steps:
          - color: green
            value: null
      overrides:
      - matcher:
          id: byName
          options: current
        properties:
        - id: mappings
          value:
          - options:
              Alerting:
                color: red
                index: 0
                text: Alerting
              NoData:
                color: gray
                index: 3
                text: NoData
              Normal:
                color: green
                index: 1
                text: Normal
              Pending:
                color: yellow
                index: 2
                text: Pending
            type: value
        - id: custom.cellOptions
          value:
            type: color-background
        - id: custom.width
          value: 120
      - matcher:
          id: byName
          options: previous
        properties:
        - id: custom.cellOptions
          value:
            type: color-background
        - id: custom.width
          value: 120
      - matcher:
          id: byName
          options: Time
        properties:
        - id: custom.width
          value: 170
      - matcher:
          id: byName
          options: ruleTitle
        properties:
        - id: custom.width
          value: 260
      - matcher:
          id: byName
          options: grafana_folder
        properties:
        - id: custom.width
          value: 180
      - matcher:
          id: byName
          options: severity
        properties:
        - id: custom.width
          value: 90
      - matcher:
          id: byName
          options: condition
        properties:
        - id: custom.width
          value: 80
      - matcher:
          id: byName
          options: ruleUID
        properties:
        - id: custom.width
          value: 220
      - matcher:
          id: byName
          options: fingerprint
        properties:
        - id: custom.width
          value: 140
    gridPos:
      h: 14
      w: 24
      x: 0
      y: 7
    id: 16
    options:
      cellHeight: sm
      footer:
        countRows: false
        enablePagination: true
        fields: ''
        reducer:
        - sum
        show: false
      showHeader: true
      sortBy:
      - desc: true
        displayName: Time
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      direction: backward
      editorMode: code
      expr: '{from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json alertname="labels.alertname",
        current, previous, ruleTitle, severity="labels.severity", condition, ruleUID,
        dashboardUID, fingerprint, grafana_folder="labels.grafana_folder" | alertname=~"(?i).*$alertname.*"
        | drop __error__, __error_details__'
      queryType: range
      refId: A
    title: Grafana Alert State History — Full Detail
    transformations:
    - id: extractFields
      options:
        replace: false
        source: labels
    - id: filterFieldsByName
      options:
        include:
          names:
          - Time
          - current
          - previous
          - ruleTitle
          - severity
          - grafana_folder
          - condition
          - ruleUID
          - fingerprint
    type: table

  # ── Raw log panel ─────────────────────────────────────────────────────────
  - datasource:
      type: loki
      uid: ${datasource}
    gridPos:
      h: 12
      w: 24
      x: 0
      y: 29
    id: 17
    options:
      dedupStrategy: none
      enableInfiniteScrolling: false
      enableLogDetails: true
      prettifyLogMessage: true
      showCommonLabels: false
      showControls: false
      showLabels: true
      showLevel: true
      showTime: true
      sortOrder: Descending
      wrapLogMessage: false
    pluginVersion: 11.5.2
    targets:
    - datasource:
        type: loki
        uid: ${datasource}
      editorMode: code
      expr: '{from="state-history", folderUID=~".*$folderUID.*", group=~".*$group.*"} | json alertname="labels.alertname",
        current, previous, ruleTitle, severity="labels.severity" | alertname=~"(?i).*$alertname.*"
        | drop __error__, __error_details__'
      maxLines: 200
      queryType: range
      refId: A
    title: Alert State History Log
    type: logs

  refresh: 30s
  schemaVersion: 42
  tags:
  - alerthistory
  - grafana
  - details
  templating:
    list:
    - current:
        text: duplo-logging
        value: duplo-logging
      includeAll: false
      label: Loki Datasource
      name: datasource
      options: []
      query: loki
      refresh: 1
      regex: ''
      type: datasource
    - allValue: .+
      current:
        text: All
        value: $__all
      datasource:
        type: loki
        uid: ${datasource}
      definition: ''
      includeAll: true
      label: Folder
      multi: false
      name: folderUID
      options: []
      query:
        label: folderUID
        refId: LokiVariableQueryEditor-VariableQuery
        stream: '{from="state-history"}'
        type: 1
      refresh: 2
      regex: ''
      sort: 1
      type: query
    - allValue: .+
      current:
        text: All
        value: $__all
      datasource:
        type: loki
        uid: ${datasource}
      definition: ''
      includeAll: true
      label: Alert Group
      multi: false
      name: group
      options: []
      query:
        label: group
        refId: LokiVariableQueryEditor-VariableQuery
        stream: '{from="state-history", folderUID=~".*$folderUID.*"}'
        type: 1
      refresh: 2
      regex: ''
      sort: 1
      type: query
    - current:
        text: .*
        value: .*
      label: Alert Name Filter
      name: alertname
      options:
      - selected: true
        text: .*
        value: .*
      query: .*
      type: textbox
  time:
    from: now-24h
    to: now
  timepicker: {}
  timezone: browser
  title: Grafana Alert Details
  uid: alerthistory-grafana-details
